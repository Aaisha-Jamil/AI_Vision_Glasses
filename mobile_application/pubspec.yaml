
name: mobile_application
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  image_picker: ^1.2.4
  http: ^1.2.0
  web_socket_channel: ^3.0.3
  permission_handler: ^11.3.1
  record: ^5.2.1
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

dependency_overrides:
  record_web: 1.3.0
  # record 5.2.1 pulls record_linux 0.7.2, which does not compile against
  # record_platform_interface 1.6.0 (breaks Android release builds).
  record_linux: 1.3.1